name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mena-research-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall src tests
      # Live smoke test (test_query_expansion.py) self-skips without an API
      # key, so this runs only the free offline suite.
      - run: python -m pytest tests/ -v
